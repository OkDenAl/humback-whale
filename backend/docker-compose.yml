version: '3.7'

services:
  humpback-whale-postgres:
    container_name: humpback-whale-postgres
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: diploma-humpback-whale
    volumes:
      - ${PWD}/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./dbdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks: [backend]
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 3s
      timeout: 5s
      retries: 5

  humpback-whale-minio:
    restart: always
    image: bitnami/minio:latest
    container_name: humpback-whale-minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      # также указываем login & password
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=veryhardpass
      - MINIO_SKIP_CLIENT=yes
      - MINIO_SCHEME=http
      - MINIO_CONSOLE_PORT_NUMBER=9001
    networks: [backend]
    volumes:
      - ./miniosolo:/bitnami/minio/data

  nginx:
    image: nginx
    container_name: nginx
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
      - ../frontend/whale-catalog/dist:/usr/share/nginx/html
    ports:
      - "80:80"
    networks: [ backend ]
    restart: always

networks:
  backend:
    driver: bridge
