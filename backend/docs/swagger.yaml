basePath: /api/v1
definitions:
  dto.HumpbackWhaleImage:
    properties:
      author_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      username:
        type: string
      whale_type:
        type: string
    type: object
  handler.getImagesResp:
    properties:
      next_page_url:
        type: string
      prev_page_url:
        type: string
      whale_images:
        items:
          $ref: '#/definitions/dto.HumpbackWhaleImage'
        type: array
    type: object
  handler.httpError:
    properties:
      code:
        type: integer
      error:
        type: string
    type: object
  handler.reqLogin:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  handler.reqRegister:
    properties:
      email:
        type: string
      password:
        type: string
      role:
        type: string
      username:
        type: string
    type: object
  handler.respLogin:
    properties:
      is_scientist:
        type: boolean
      token:
        type: string
      username:
        type: string
    type: object
  handler.respRegister:
    properties:
      token:
        type: string
    type: object
  handler.uploadImgResp:
    properties:
      url:
        type: string
    type: object
host: localhost:80
info:
  contact:
    name: humback-whale
    url: https://github.com/OkDenAl/humback-whale
  description: Text markup - it is the service for getting markup from text.
  title: Humpback whale recognition service
  version: "1.0"
paths:
  /private/whale/images:
    get:
      description: get markup from text
      parameters:
      - description: Latitude
        in: query
        name: limit
        required: true
        type: integer
      - description: authorization bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.getImagesResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.httpError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.httpError'
      summary: get images
      tags:
      - Whale
  /private/whale/upload:
    post:
      consumes:
      - multipart/form-data
      description: upload whale image
      parameters:
      - description: File to upload
        in: formData
        name: image
        required: true
        type: file
      - description: Latitude
        in: formData
        name: latitude
        type: integer
      - description: Longitude
        in: formData
        name: longitude
        type: integer
      - description: authorization bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.uploadImgResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.httpError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.httpError'
      summary: upload whale image
      tags:
      - Whale
  /public/auth/login:
    post:
      consumes:
      - application/json
      description: login user
      parameters:
      - description: JSON
        in: body
        name: text
        required: true
        schema:
          $ref: '#/definitions/handler.reqLogin'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.respLogin'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.httpError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.httpError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.httpError'
      summary: login user
      tags:
      - Auth
  /public/auth/register:
    post:
      consumes:
      - application/json
      description: register user
      parameters:
      - description: JSON
        in: body
        name: text
        required: true
        schema:
          $ref: '#/definitions/handler.reqRegister'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.respRegister'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.httpError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.httpError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.httpError'
      summary: register user
      tags:
      - Auth
swagger: "2.0"
